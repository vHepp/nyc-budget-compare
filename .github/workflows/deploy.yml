name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_cache:
        description: "Re-fetch every fiscal year from NYC Open Data (ignore the cache)"
        type: boolean
        default: false
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC: picks up new budget releases within a week

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # How many fiscal years to publish, counting back from the newest one in the dataset.
  NUM_FISCAL_YEARS: "2"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Python tests
        run: pytest -q tests

      # Fiscal years with an Adopted release never change, so their parquet cache is reused
      # across runs; years still in progress are re-validated against Socrata by apiv8.
      - uses: actions/cache@v4
        with:
          path: data_cache
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Build site data
        env:
          SOCRATA_APP_KEY: ${{ secrets.SOCRATA_APP_KEY }}
        run: >
          python scripts/build_site_data.py --latest "$NUM_FISCAL_YEARS" --out web/public/data
          ${{ inputs.refresh_cache && '--refresh_cache' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm test
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
